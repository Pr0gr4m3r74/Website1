<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Münzwurf – IT Solutions</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="coinflip.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">IT Solutions</a>
      <nav class="nav-links">
        <a href="index.html">Start</a>
        <a href="minigames.html" aria-current="page">Mini‑Games</a>
        <a href="projects.html">Projekte</a>
        <a href="news.html">News</a>
        <a href="kontakt.html">Kontakt</a>
        <a href="impressum.html">Impressum</a>
      </nav>
      <div class="header-controls">
        <button id="themeToggle" class="theme-btn" aria-label="Theme wechseln">🌙</button>
        <button class="nav-toggle" aria-label="Menü öffnen">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main class="site-main coinflip-page">
    <section class="section">
      <div class="section-heading">
        <div class="section-heading-copy">
          <h1 class="section-title">🪙 Münzwurf</h1>
          <p class="section-desc">Wirf die Münze, beobachte die Statistik und komme jederzeit schnell zurück zur Mini‑Games-Übersicht.</p>
        </div>
        <div class="section-actions">
          <a href="minigames.html" class="btn btn-ghost">← Zurück zu Mini‑Games</a>
        </div>
      </div>

      <section class="coinflip-panel content-card" aria-live="polite">
        <div class="coin-wrap">
          <div id="coin" class="coin heads">Kopf</div>
        </div>

        <div class="controls">
          <button id="flipBtn">Münze werfen</button>
          <button id="resetBtn" class="danger">Reset</button>
        </div>

        <div class="stats" id="stats">
          Kopf: 0 &nbsp;|&nbsp; Zahl: 0 &nbsp;|&nbsp; Letztes: — &nbsp;|&nbsp; Serie: 0
        </div>
      </section>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 IT Solutions</p>
    <div>
      <a href="minigames.html">Zurück zu Mini‑Games</a>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/theme-manager.js"></script>
  <script src="js/app.js"></script>
  <script>
  let heads = 0, tails = 0, last = null, streak = 0;
  const coinEl = document.getElementById('coin');
  const statsEl = document.getElementById('stats');
  const flipBtn = document.getElementById('flipBtn');
  const resetBtn = document.getElementById('resetBtn');

  function updateStats(result){
    if (last === result) streak++;
    else { streak = 1; last = result; }
    if (result === 'Kopf') heads++; else tails++;
    statsEl.textContent = `Kopf: ${heads} | Zahl: ${tails} | Letztes: ${result} | Serie: ${streak}`;
  }

  function flipAnimation(result){
    coinEl.classList.add('flipping');
    setTimeout(() => {
      coinEl.classList.remove('heads','tails');
      coinEl.classList.add(result === 'Kopf' ? 'heads' : 'tails');
      coinEl.textContent = result;
    }, 320);
    setTimeout(() => {
      coinEl.classList.remove('flipping');
    }, 750);
  }

  function flipCoin(){
    flipBtn.disabled = true;
    const r = Math.random() < 0.5 ? 'Kopf' : 'Zahl';
    flipAnimation(r);
    setTimeout(() => {
      updateStats(r);
      flipBtn.disabled = false;
    }, 820);
  }

  function reset(){
    heads = 0; tails = 0; last = null; streak = 0;
    coinEl.classList.remove('tails');
    coinEl.classList.add('heads');
    coinEl.textContent = 'Kopf';
    statsEl.textContent = 'Kopf: 0 | Zahl: 0 | Letztes: — | Serie: 0';
  }

  flipBtn.addEventListener('click', flipCoin);
  resetBtn.addEventListener('click', reset);
  </script>
</body>
</html>
